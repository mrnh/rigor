name: Publish

# Triggered by publishing a GitHub Release (tag the release vX.Y.Z to
# match the version in pyproject.toml -- and server.json, checked by
# tests/test_release_metadata.py). Also runnable by hand for a dry run
# that stops short of the actual uploads (see the `if` guards on the
# publish jobs).
#
# Publishes to two independent places, both via OIDC (no stored
# tokens): PyPI (pypa/gh-action-pypi-publish, Trusted Publishing) and
# the MCP Registry (mcp-publisher, github-oidc auth -- works because
# this repo's name matches the io.github.mrnh/rigor-mcp namespace in
# server.json). A release only needs to be tagged once; both targets
# update from that single trigger.
on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install .
      - run: python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC) -- no stored token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Lets a Release whose version is already on PyPI (e.g. one
          # tagged retroactively, or a re-run) succeed as a no-op
          # instead of failing the whole workflow.
          skip-existing: true

  publish-mcp-registry:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for the MCP Registry's GitHub OIDC auth -- no stored token
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
