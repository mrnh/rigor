[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rigor-mcp"
version = "0.3.0"
description = "Verified statistical inference for AI agents -- classical and non-parametric hypothesis testing, correlation/regression, effect sizes, power/sample-size, multiple-comparisons correction, a test-recommendation helper, and a batch pairwise-comparison tool, as a CLI and an MCP server"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Marian Heidtmann" }]
requires-python = ">=3.9"
# mcp is a required dependency (not the rest of rigor's stdlib-only
# statistics) so that `pip install rigor-mcp` / `uvx rigor-mcp` always
# works, with no extras syntax for MCP clients/registries to get wrong.
dependencies = ["mcp>=1.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
keywords = ["mcp", "model-context-protocol", "statistics", "hypothesis-testing", "ai-agents", "correlation", "regression", "non-parametric"]

[project.urls]
Homepage = "https://github.com/mrnh/rigor"
Repository = "https://github.com/mrnh/rigor"
Issues = "https://github.com/mrnh/rigor/issues"

[project.scripts]
rigor = "rigor.cli:main"
rigor-mcp = "rigor.mcp_server:main"

[tool.setuptools.packages.find]
include = ["rigor*"]
